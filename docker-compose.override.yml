# Local development overrides. Docker Compose auto-merges this file when you
# run `docker compose up` from the repo root. Coolify uses
# `-f docker-compose.yaml` explicitly, so nothing here reaches production.
#
# Expose the API on host port 8000. In production Traefik routes the domain
# and no host-port binding is used.

services:
  backend:
    ports:
      - "8000:8000"
