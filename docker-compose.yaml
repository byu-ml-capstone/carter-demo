services:
  hello:
    build: ./hello
    expose:
      - "8000"
    environment:
      - APP_URL=${SERVICE_FQDN_HELLO}
      - DATABASE_URL=sqlite:////data/workspace.db
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:43123}
    volumes:
      - workspace-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      start_period: 30s
      start_interval: 2s
      interval: 5m
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  workspace-data:
